// ESP32 link: the JSON messages from docs/message-schema.md, one per line, written in 20-byte pieces
class BleLink{
 constructor(id){this.id=id;this.readyState=0;this.dec=new TextDecoder();this.buf="";this.q=Promise.resolve();this.gone=false}
 async open(){try{await BT.connect(this.id,()=>this._end());await BT.notify(this.id,NUS,NUS_TX,u=>this._rx(u));this.readyState=1;this.onopen&&this.onopen()}catch(e){this._end()}}
 _rx(u){this.buf+=this.dec.decode(u,{stream:true});let i;while((i=this.buf.indexOf("\n"))>=0){const l=this.buf.slice(0,i).trim();this.buf=this.buf.slice(i+1);if(l&&this.onmessage)this.onmessage({data:l})}}
 send(s){if(this.readyState!==1)return;const b=new TextEncoder().encode(s+"\n");
  this.q=this.q.then(async()=>{for(let o=0;o<b.length;o+=20){if(this.readyState!==1)return;await BT.write(this.id,NUS,NUS_RX,b.subarray(o,o+20))}}).catch(()=>this._end())}
 close(){BT.disconnect(this.id);this._end()}
 _end(){if(this.gone)return;this.gone=true;this.readyState=3;BT.clear(this.id);this.onclose&&this.onclose()}
}

function ganRx(u){

 const center=()=>{el=tm;if(!el)return;el.style.transform='';const r=el.getBoundingClientRect();el.style.transform='translateY('+Math.round(innerHeight/2-(r.top+r.height/2))+'px)'};
 const reset=()=>{document.querySelectorAll('#time,#dtime').forEach(x=>x.style.transform='');el=null};

 addEventListener('resize',()=>{if(was&&el)center()});
